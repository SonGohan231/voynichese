name: Probe Yale Voynich manifest

on:
  push:
    branches:
      - import-voynich-yale-scans-2026-07-23
    paths:
      - .github/workflows/probe-yale-voynich.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import-voynich-yale-scans-2026-07-23
          fetch-depth: 0

      - name: Fetch and inspect Yale IIIF manifest
        shell: python
        run: |
          import json
          import pathlib
          import urllib.request

          url = "https://collections.library.yale.edu/manifests/2002046"
          req = urllib.request.Request(url, headers={"User-Agent": "VoynichResearchImport/1.0"})
          with urllib.request.urlopen(req, timeout=120) as response:
              data = json.load(response)

          canvases = []
          if data.get("items"):
              raw_canvases = data["items"]
              version = 3
              for index, canvas in enumerate(raw_canvases, start=1):
                  label_obj = canvas.get("label", {})
                  if isinstance(label_obj, dict):
                      values = next(iter(label_obj.values()), [])
                      label = values[0] if values else ""
                  else:
                      label = str(label_obj or "")
                  body = (((canvas.get("items") or [{}])[0].get("items") or [{}])[0].get("body") or {})
                  service = body.get("service") or []
                  if isinstance(service, dict):
                      service = [service]
                  service_id = (service[0].get("id") or service[0].get("@id")) if service else None
                  image_id = body.get("id") or body.get("@id")
                  canvases.append({"index": index, "label": label, "canvas_id": canvas.get("id"), "image_id": image_id, "service_id": service_id})
          else:
              raw_canvases = (((data.get("sequences") or [{}])[0]).get("canvases") or [])
              version = 2
              for index, canvas in enumerate(raw_canvases, start=1):
                  image = ((canvas.get("images") or [{}])[0].get("resource") or {})
                  service = image.get("service") or {}
                  service_id = service.get("@id") or service.get("id")
                  image_id = image.get("@id") or image.get("id")
                  canvases.append({"index": index, "label": str(canvas.get("label") or ""), "canvas_id": canvas.get("@id"), "image_id": image_id, "service_id": service_id})

          out = pathlib.Path("imports/voynich")
          out.mkdir(parents=True, exist_ok=True)
          (out / "yale_manifest_probe.json").write_text(json.dumps({
              "manifest_url": url,
              "iiif_presentation_version": version,
              "canvas_count": len(canvases),
              "canvases": canvases
          }, ensure_ascii=False, indent=2), encoding="utf-8")

      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imports/voynich/yale_manifest_probe.json
          git commit -m "Probe Yale Voynich IIIF manifest" || exit 0
          git push origin HEAD:import-voynich-yale-scans-2026-07-23
