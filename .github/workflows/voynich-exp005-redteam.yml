name: Voynich EXP005 independent channel-wise red-team

on:
  push:
    branches:
      - research/mv-semantic-review-20261009
    paths:
      - "research_os/tools/exp005_redteam_crossfamily.py"
      - ".github/workflows/voynich-exp005-redteam.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-channel-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source image analysis dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'opencv-python-headless==4.10.0.84' 'Pillow>=10,<12' 'scikit-image>=0.24,<0.26'
      - name: Check independent red-team algorithm and metadata constraints
        run: |
          python research_os/tools/exp005_multi_family_controls.py --selftest
          python research_os/tools/exp005_redteam_crossfamily.py --selftest
      - name: Reverify Yale sources and recalculate both nonsemantic mask models
        run: |
          python research_os/tools/exp005_semantic_source_pack.py --out research_os/experiments/EXP-2026-005/native_semantic_review
          python research_os/tools/exp005_multi_family_controls.py --out research_os/experiments/EXP-2026-005/multi_family_feature_test
      - name: Break down each preselected result by count, outline, and appearance separately
        run: |
          python research_os/tools/exp005_redteam_crossfamily.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_os/experiments/EXP-2026-005/multi_family_feature_test/redteam_cross_channel_breakdown.json")
          j=json.loads(p.read_text())
          assert j["physical_independent_pair_count"]==35
          assert j["target_pair_count"]==5
          assert j["background_null_pair_count"]==30
          assert j["text_only_status"].startswith("NOT_ASSESSED")
          assert j["MV3"]==j["MV4"]==0
          assert j["EXP001_heldout_used"] is False
          for row in j["preselected_pair_audits"]:
              assert row["matched_null_count"]>=8
              assert len(row["channel_rank_audits"])==4
              assert row["judgment"]=="MOTIF_REVIEW_ONLY_NO_SAME_OBJECT_IDENTITY"
          print("EXP005_REDTEAM_QA_PASS 5 targets versus 30 matched catalog-controls")
          PY
      - name: Save independent three-channel null audit and full reproducible feature arrays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voynich-exp005-channel-redteam
          path: research_os/experiments/EXP-2026-005/multi_family_feature_test/
          if-no-files-found: warn
          retention-days: 30
