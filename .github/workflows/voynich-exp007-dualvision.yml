name: Voynich EXP007 two independent pretrained vision inference passes

on:
  push:
    branches:
      - research/voynich-dualvision-exp007-20261009
    paths:
      - "research_os/tools/exp007_dualvision_blind_review.py"
      - ".github/workflows/voynich-exp007-dualvision.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-yale-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source integrity dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'Pillow==10.4.0' 'opencv-python-headless==4.10.0.84'
      - name: Verify original Yale JPEGs and freeze 18 images before visual inference
        run: |
          python research_os/tools/exp007_dualvision_blind_review.py selftest
          python research_os/tools/exp005_semantic_source_pack.py \
            --out research_os/experiments/EXP-2026-005/native_semantic_review
          python research_os/tools/exp007_dualvision_blind_review.py freeze
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_os/experiments/EXP-2026-007/dual_vision/frozen_18_crop_manifest.json")
          j=json.loads(p.read_text())
          assert j["crop_count"]==18 and j["source_photo_count"]==9
          assert "EXP-2026-001_HELDOUT"==j["excluded_data"]
          assert len(set(x["crop_sha256"] for x in j["crop_ids"]))>=12
          print("EXP007_FROZEN_PROVENANCE_QA_PASS",len(j["crop_ids"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp007-frozen-Yale-source-pixels
          path: |
            research_os/experiments/EXP-2026-007/dual_vision/frozen_18_crop_manifest.json
            research_os/experiments/EXP-2026-005/native_semantic_review/
          if-no-files-found: error
          retention-days: 30

  blind-caption-A:
    needs: frozen-yale-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "180"
      OMP_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: exp007-frozen-Yale-source-pixels
          path: research_os/experiments
      - name: Install CPU model runtime and pinned transformer API
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.4.1'
          python -m pip install 'numpy==1.26.4' 'Pillow==10.4.0' 'transformers==4.45.2' 'safetensors>=0.4,<1' 'huggingface_hub>=0.25,<1'
      - name: BLIND MODEL A - image captions without B predictions
        run: |
          python research_os/tools/exp007_dualvision_blind_review.py caption
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_os/experiments/EXP-2026-007/dual_vision/pass_a_blip_captions.json")
          j=json.loads(p.read_text())
          assert j["n"]==18 and len(j["records"])==18
          assert j["historical_semantics_accepted"]==0
          assert all(x["category"]=="UNKNOWN" for x in j["records"])
          print("EXP007_TRUE_VISION_A_PASS",j["model"],j["n"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp007-real-blind-blip-model-A
          path: research_os/experiments/EXP-2026-007/dual_vision/pass_a_blip_captions.json
          if-no-files-found: warn
          retention-days: 30

  blind-contrast-B:
    needs: frozen-yale-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "180"
      OMP_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: exp007-frozen-Yale-source-pixels
          path: research_os/experiments
      - name: Install CPU model runtime and pinned transformer API
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.4.1'
          python -m pip install 'numpy==1.26.4' 'Pillow==10.4.0' 'transformers==4.45.2' 'safetensors>=0.4,<1' 'huggingface_hub>=0.25,<1'
      - name: BLIND MODEL B - image text prompt scores without A captions
        run: |
          python research_os/tools/exp007_dualvision_blind_review.py contrast
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_os/experiments/EXP-2026-007/dual_vision/pass_b_clip_labels.json")
          j=json.loads(p.read_text())
          assert j["n"]==18 and len(j["records"])==18
          assert j["historical_semantics_accepted"]==0
          assert all(len(x["scores_all_prompts"])==7 for x in j["records"])
          print("EXP007_TRUE_VISION_B_PASS",j["model"],j["n"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp007-real-blind-clip-model-B
          path: research_os/experiments/EXP-2026-007/dual_vision/pass_b_clip_labels.json
          if-no-files-found: warn
          retention-days: 30

  blind-disagreement-audit:
    needs: [frozen-yale-evidence,blind-caption-A,blind-contrast-B]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: exp007-frozen-Yale-source-pixels
          path: research_os/experiments
      - uses: actions/download-artifact@v4
        with:
          name: exp007-real-blind-blip-model-A
          path: research_os/experiments/EXP-2026-007/dual_vision
      - uses: actions/download-artifact@v4
        with:
          name: exp007-real-blind-clip-model-B
          path: research_os/experiments/EXP-2026-007/dual_vision
      - name: Audit two actual independent AI image predictions, preserve UNKNOWN
        run: |
          python research_os/tools/exp007_dualvision_blind_review.py audit
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_os/experiments/EXP-2026-007/dual_vision/blind_vision_disagreements.json")
          j=json.loads(p.read_text())
          assert j["image_count"]==18
          assert j["two_separate_pretrained_vision_models"]
          assert not j["two_independent_human_reviewers"]
          assert j["zero_historical_object_confirmations"]
          assert j["seal_exp001_heldout_untouched"]
          assert all(x["adjudicated_historical_object_class"]=="UNKNOWN" for x in j["crop_reviews"])
          print("EXP007_AI_INDEPENDENCE_QA_PASS 18 images, 2 distinct real models, human annotations pending")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp007-independent-AI-vision-disagreement-audit
          path: research_os/experiments/EXP-2026-007/dual_vision/blind_vision_disagreements.json
          if-no-files-found: error
          retention-days: 30
