name: Voynich EXP004 source-curated central blue rosette sensitivity
on:
  push:
    branches:
      - research/exp-2026-002-sectional-locality-prereg-20261008
    paths:
      - "research_os/tools/exp004_curated_blue_core_pilot.py"
      - ".github/workflows/exp004-curated-blue-core.yml"
  pull_request:
    branches: [master]
    paths:
      - "research_os/tools/exp004_curated_blue_core_pilot.py"
      - ".github/workflows/exp004-curated-blue-core.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unblinded-central-motif-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exp-2026-002-sectional-locality-prereg-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned OpenCV and Pillow
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'opencv-python-headless==4.10.0.84' 'Pillow>=10,<12'
      - name: Validate separate pilot seed geometry
        run: python research_os/tools/exp004_curated_blue_core_pilot.py --selftest
      - name: Verify archival source SHA and analyze independently cropped blue motifs
        run: |
          python research_os/tools/exp004_curated_blue_core_pilot.py \
            --out research_os/experiments/EXP-2026-004/manually_seeded_blue_radial_v1.json \
            --board research_os/experiments/EXP-2026-004/manually_seeded_blue_radial_board.png
      - name: Preserve exploratory color radial rerun and original comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp004-source-blue-central-motifs-unblinded
          path: |
            research_os/experiments/EXP-2026-004/manually_seeded_blue_radial_v1.json
            research_os/experiments/EXP-2026-004/manually_seeded_blue_radial_board.png
          if-no-files-found: warn
          retention-days: 30
