name: EXP-2026-003 foldout geometric imagery probes

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "research_os/tools/exp003_foldout_geometry_probe.py"
      - ".github/workflows/exp003-foldout-geometry.yml"

permissions:
  contents: write

jobs:
  native-foldout-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exp-2026-002-sectional-locality-prereg-20261008
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned image-analysis packages
        run: |
          python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'opencv-python-headless==4.10.0.84'
      - name: Re-fetch eight original Yale JPEGs with SHA-256 verification
        run: |
          python3 research_os/tools/exp003_foldout_geometry_probe.py \
            --output research_os/experiments/EXP-2026-003/foldout_geometry_probe_2026-10-09.json
      - name: Preserve source-linked geometry measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp003-q9-q14-highres-geometry-probes
          path: research_os/experiments/EXP-2026-003/foldout_geometry_probe_2026-10-09.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish geometry report when measurements succeeded
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_os/experiments/EXP-2026-003/foldout_geometry_probe_2026-10-09.json
          if ! git diff --cached --quiet; then
            git commit -m "research(exp003): 8-source Yale foldout circle and line candidates"
            git pull --rebase origin research/exp-2026-002-sectional-locality-prereg-20261008
            git push origin HEAD:research/exp-2026-002-sectional-locality-prereg-20261008
          fi
