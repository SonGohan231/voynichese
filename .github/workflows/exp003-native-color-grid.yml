name: Voynich EXP003 native color-grid exploratory audit

on:
  push:
    branches:
      - research/exp-2026-002-sectional-locality-prereg-20261008
    paths:
      - "research_os/tools/exp003_native_color_grid_pilot.py"
      - ".github/workflows/exp003-native-color-grid.yml"
  pull_request:
    branches: [master]
    paths:
      - "research_os/tools/exp003_native_color_grid_pilot.py"
      - ".github/workflows/exp003-native-color-grid.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-three-sha-verified-source-canvases:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exp-2026-002-sectional-locality-prereg-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matching fixed image runtime
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'opencv-python-headless==4.10.0.84'
      - name: Unit test source-grid pixel region accounting
        run: python research_os/tools/exp003_native_color_grid_pilot.py --selftest
      - name: Verify SHA and compute color/grayscale spatial profiles on 9r, Rosettes, 94v-95r
        run: |
          python research_os/tools/exp003_native_color_grid_pilot.py \
            --output research_os/experiments/EXP-2026-003/native_color_grid_pilot_2026-10-09.json
      - name: Preserve source pixel quantification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp003-three-source-color-grid-pilot
          path: research_os/experiments/EXP-2026-003/native_color_grid_pilot_2026-10-09.json
          if-no-files-found: warn
          retention-days: 30
