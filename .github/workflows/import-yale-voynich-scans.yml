name: Import Yale Voynich scans

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-yale-voynich-scans
  cancel-in-progress: true

jobs:
  import:
    if: github.head_ref == 'import-voynich-yale-scans-2026-07-23' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import-voynich-yale-scans-2026-07-23
          fetch-depth: 0

      - name: Download the 207 unpacked source files from Yale IIIF
        shell: python
        run: |
          import csv
          import hashlib
          import json
          import pathlib
          import time
          import urllib.request

          MANIFEST_URL = "https://collections.library.yale.edu/manifests/2002046"
          ROOT = pathlib.Path("data/yale_hq_scans")
          USER_AGENT = "VoynichResearchImport/1.0 (+https://github.com/SonGohan231/voynichese)"

          def fetch_json(url, attempts=5):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
                      with urllib.request.urlopen(req, timeout=180) as response:
                          return json.load(response)
                  except Exception as exc:
                      last = exc
                      if attempt < attempts:
                          time.sleep(attempt * 4)
              raise RuntimeError(f"Failed to fetch JSON after {attempts} attempts: {url}: {last}")

          def download(url, destination, attempts=5):
              destination.parent.mkdir(parents=True, exist_ok=True)
              temporary = destination.with_suffix(destination.suffix + ".part")
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
                      with urllib.request.urlopen(req, timeout=600) as response, temporary.open("wb") as output:
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk:
                                  break
                              output.write(chunk)
                      with temporary.open("rb") as check:
                          if check.read(2) != b"\xff\xd8":
                              raise ValueError("Downloaded file is not a JPEG")
                      temporary.replace(destination)
                      return
                  except Exception as exc:
                      last = exc
                      temporary.unlink(missing_ok=True)
                      if attempt < attempts:
                          time.sleep(attempt * 6)
              raise RuntimeError(f"Failed to download after {attempts} attempts: {url}: {last}")

          manifest = fetch_json(MANIFEST_URL)
          canvases = manifest.get("items") or []
          if len(canvases) < 206:
              raise RuntimeError(f"Expected at least 206 canvases, found {len(canvases)}")

          requested = []
          with pathlib.Path("imports/voynich/uploaded_files.tsv").open(encoding="utf-8", newline="") as handle:
              for row in csv.DictReader(handle, delimiter="\t"):
                  filename = row["filename"]
                  sequence = int(filename.split("_", 1)[0])
                  if not 1 <= sequence <= 206:
                      raise ValueError(f"Unexpected sequence in {filename}")
                  requested.append((row["archive"], filename, sequence))

          if len(requested) != 207:
              raise RuntimeError(f"Expected 207 unpacked files, found {len(requested)} rows")

          report = []
          for position, (archive, filename, sequence) in enumerate(requested, start=1):
              canvas = canvases[sequence - 1]
              label_obj = canvas.get("label") or {}
              if isinstance(label_obj, dict):
                  values = next(iter(label_obj.values()), [])
                  label = values[0] if values else ""
              else:
                  label = str(label_obj)

              annotation_page = (canvas.get("items") or [None])[0] or {}
              annotation = (annotation_page.get("items") or [None])[0] or {}
              body = annotation.get("body") or {}
              services = body.get("service") or []
              if isinstance(services, dict):
                  services = [services]
              service_id = None
              if services:
                  service_id = services[0].get("id") or services[0].get("@id")
              image_url = (service_id.rstrip("/") + "/full/full/0/default.jpg") if service_id else (body.get("id") or body.get("@id"))
              if not image_url:
                  raise RuntimeError(f"Canvas {sequence} has no image URL")

              destination = ROOT / archive / filename
              if not destination.exists():
                  print(f"[{position:03d}/207] {label} -> {destination}", flush=True)
                  download(image_url, destination)

              digest = hashlib.sha256()
              with destination.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(chunk)
              report.append({
                  "archive": archive,
                  "filename": filename,
                  "sequence": sequence,
                  "yale_canvas_label": label,
                  "yale_canvas_id": canvas.get("id") or canvas.get("@id"),
                  "image_url": image_url,
                  "bytes": destination.stat().st_size,
                  "sha256": digest.hexdigest(),
              })

          ROOT.mkdir(parents=True, exist_ok=True)
          (ROOT / "import_report.json").write_text(json.dumps({
              "source_manifest": MANIFEST_URL,
              "manifest_canvas_count": len(canvases),
              "imported_file_count": len(report),
              "unique_sequence_count": len({item["sequence"] for item in report}),
              "duplicate_sequences_preserved": [23],
              "files": report,
          }, ensure_ascii=False, indent=2), encoding="utf-8")

          (ROOT / "README.md").write_text(
              "# Yale high-resolution Voynich scans\n\n"
              "This directory contains the 207 JPEG files unpacked from the ten uploaded source archives. "
              "There are 206 unique page-image positions; `0023_11r.jpg` is intentionally preserved in both archive 1 and archive 2 because it occurred in both uploads.\n\n"
              "Source: Yale University Library, Beinecke MS 408, IIIF manifest `https://collections.library.yale.edu/manifests/2002046`.\n\n"
              "Files are grouped by the original archive number: `1`, `2`, `3`, `4`, `5`, `6`, `8`, `9`, `10`, and `11`. "
              "See `import_report.json` for the Yale canvas, download URL, byte size, and SHA-256 checksum of every imported file.\n",
              encoding="utf-8",
          )

      - name: Commit and push each original archive batch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for archive in 1 2 3 4 5 6 8 9 10 11; do
            git add "data/yale_hq_scans/$archive"
            if ! git diff --cached --quiet; then
              git commit -m "Import Yale Voynich scan batch $archive"
              git push origin HEAD:import-voynich-yale-scans-2026-07-23
            fi
          done

          git add data/yale_hq_scans/README.md data/yale_hq_scans/import_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Add Yale Voynich scan import index and checksums"
            git push origin HEAD:import-voynich-yale-scans-2026-07-23
          fi
