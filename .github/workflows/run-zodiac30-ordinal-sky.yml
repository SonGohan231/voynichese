name: Run zodiac ordinal transfer and sky 1404-1430

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zodiac30-ordinal-sky
  cancel-in-progress: true

jobs:
  execute:
    if: github.head_ref == 'experiment-zodiac30-ordinal-and-sky-1404-1430' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-zodiac30-ordinal-and-sky-1404-1430
          fetch-depth: 0

      - name: Install numerical astronomy dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib pyswisseph

      - name: Execute frozen label-transfer experiment
        run: python research/zodiac30_ordinal_sky/scripts/run_ordinal_label_transfer.py research/zodiac30_ordinal_sky/results

      - name: Reconstruct sky 1404-1430
        run: python research/zodiac30_ordinal_sky/scripts/build_sky_1404_1430.py research/zodiac30_ordinal_sky/astronomy

      - name: Verify generated contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/zodiac30_ordinal_sky/results/RESULT.json').read_text())
          assert r['total_Lz_loci']==299
          assert r['primary']['permutations']==100000
          assert r['primary']['seed']==3001425
          assert len(r['heldout'])==7
          a=json.loads(Path('research/zodiac30_ordinal_sky/astronomy/ASTRONOMY_RESULT.json').read_text())
          assert a['method']['calendar']=='Julian'
          assert len(a['great_conjunctions'])>=4
          PY

      - name: Commit generated results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/zodiac30_ordinal_sky/results research/zodiac30_ordinal_sky/astronomy
          if git diff --cached --quiet; then
            echo "Generated results are current."
            exit 0
          fi
          git commit -m "Execute zodiac ordinal transfer and reconstruct sky 1404-1430"
          git push origin HEAD:experiment-zodiac30-ordinal-and-sky-1404-1430
