name: Voynich EXP005 verified native semantic review pack

on:
  push:
    branches:
      - research/mv-semantic-review-20261009
    paths:
      - "research_os/tools/exp005_semantic_source_pack.py"
      - ".github/workflows/voynich-exp005-source-review-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-resolution-semantic-review-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded image analysis requirements
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'opencv-python-headless==4.10.0.84' 'Pillow>=10,<12'
      - name: Check provenance and crop-policy invariants
        run: python research_os/tools/exp005_semantic_source_pack.py --selftest
      - name: Retrieve SHA verified original Yale photographs and create distinct crop review packs
        run: |
          python research_os/tools/exp005_semantic_source_pack.py \
            --out research_os/experiments/EXP-2026-005/native_semantic_review
          python - <<'PY'
          from pathlib import Path
          import json
          src=Path("research_os/experiments/EXP-2026-005/native_semantic_review")
          d=json.loads((src/"review_manifest.json").read_text())
          assert d["source_photos"]==9 and d["source_native_crops"]>=27, d
          assert len(d["primary_comparisons"])==5
          assert all((src/r["crop_path"]).is_file() for r in d["proposed_regions"])
          assert all(not(set(d["review_photos"][x["left"]]["physical_groups"]) & set(d["review_photos"][x["right"]]["physical_groups"])) for x in d["primary_comparisons"])
          assert all((src/x["comparison_board"]).is_file() for x in d["primary_comparisons"])
          assert not d["source_heldout_used"]
          assert d["accepted_MV3"]==0 and d["accepted_MV4"]==0
          assert not d["blind_human_ground_truth"]
          assert all(x=="NOT_RUN" for x in d["four_null_models"].values())
          print("EXP005_NATIVE_EVIDENCE_QA_PASS exact photos, crop integrity, and no false science claims")
          PY
      - name: Preserve all native source crops, manifests and human review boards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voynich-exp005-native-semantic-source-pack
          path: research_os/experiments/EXP-2026-005/native_semantic_review/
          if-no-files-found: warn
          retention-days: 30
